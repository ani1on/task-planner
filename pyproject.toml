[project]
name = "task-planner"
version = "0.1.0"
description = "task-planner — task manager with PySide6 + FastAPI"
readme = "README.md"
requires-python = ">=3.10"
authors = [
    {name = "Your Name", email = "your@email.com"}
]

dependencies = [
    # Backend
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.34.0",
    "sqlalchemy>=2.0.36",
    "alembic>=1.14.1",
    "psycopg2-binary>=2.9.10",
    "python-dotenv>=1.0.0",
    "pydantic>=2.10.0",
    "pydantic-settings>=2.6.0",
    "python-jose[cryptography]>=3.3.0",
    "pwdlib[argon2]",
    "python-multipart>=0.0.20",

    # Frontend
    "PySide6>=6.8.0",
    "requests>=2.32.3",
    "keyring>=25.6.0; sys_platform != 'win32'",


]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "pytest-cov>=6.0.0",
    "black>=24.10.0",
    "ruff>=0.7.0",
    "mypy>=1.13.0",
    "pre-commit>=4.0.0",
]

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["client*", "server*"]

[tool.black]
line-length = 88
target-version = ['py310']
extend-exclude = '''
/(
    \.eggs
  | \.git
  | \.hg
  | \.mypy_cache
  | \.tox
  | \.venv
  | _build
  | buck-out
  | build
  | dist
)/
'''

[tool.ruff]
line-length = 88
target-version = "py310"
extend-exclude = ["__pycache__", ".git", ".venv", "venv", ".env"]

[tool.ruff.lint.flake8-bugbear]
# FastAPI передаёт зависимости и параметры запроса через значения по умолчанию.
extend-immutable-calls = [
    "fastapi.Body",
    "fastapi.Cookie",
    "fastapi.Depends",
    "fastapi.File",
    "fastapi.Form",
    "fastapi.Header",
    "fastapi.Path",
    "fastapi.Query",
]

[tool.ruff.lint.per-file-ignores]
# UI-слой обрабатывает ошибки API на границе и держит ссылку на QApplication.
"client/**" = ["BLE001", "F841"]
# Ручные скрипты проверки: печатают любые ошибки и держат QApplication живым.
"scripts/**" = ["BLE001", "F841"]

[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_configs = true
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["server/tests", "client/tests"]
asyncio_mode = "auto"
