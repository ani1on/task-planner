[project]
name = "task-planner"
version = "0.1.0"
description = "task-planner — task manager with PySide6 + FastAPI"
readme = "README.md"
requires-python = ">=3.10"
authors = [
    {name = "Your Name", email = "your@email.com"}
]

dependencies = [
    # Backend
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.34.0",
    "sqlalchemy>=2.0.36",
    "alembic>=1.14.1",
    "psycopg2-binary>=2.9.10",
    "python-dotenv>=1.0.0",
    "pydantic>=2.10.0",
    "pydantic-settings>=2.6.0",
    "python-jose[cryptography]>=3.3.0",
    "passlib[bcrypt]>=1.7.4",
    "python-multipart>=0.0.20",
    "websockets>=13.1",

    # Frontend
    "PySide6>=6.8.0",
    "requests>=2.32.3",


]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "pytest-cov>=6.0.0",
    "black>=24.10.0",
    "ruff>=0.7.0",
    "mypy>=1.13.0",
    "pre-commit>=4.0.0",
]

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["client*", "server*", "shared*"]

[tool.black]
line-length = 88
target-version = ['py310']
extend-exclude = '''
/(
    \.eggs
  | \.git
  | \.hg
  | \.mypy_cache
  | \.tox
  | \.venv
  | _build
  | buck-out
  | build
  | dist
)/
'''

[tool.ruff]
line-length = 88
target-version = "py310"
extend-exclude = ["__pycache__", ".git", ".venv", "venv", ".env"]

[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_configs = true
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["server/tests", "client/tests"]
asyncio_mode = "auto"
